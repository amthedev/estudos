# =====================================================================
# Foco de Elite — Nginx como proxy reverso de https://focoelite.com.br
#
# Instalação:
#   sudo cp docs/nginx-focoelite.conf /etc/nginx/sites-available/focoelite
#   sudo ln -s /etc/nginx/sites-available/focoelite /etc/nginx/sites-enabled/focoelite
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ordem recomendada: suba primeiro só o bloco HTTP (porta 80), rode o Certbot
# (`sudo certbot --nginx -d focoelite.com.br -d www.focoelite.com.br`) e deixe que
# ele preencha os caminhos dos certificados. Se preferir manter este arquivo como
# está, gere os certificados antes com `certbot certonly --nginx`.
# =====================================================================

# Cabeçalhos de segurança e cache reaproveitados pelos servidores abaixo.
map $sent_http_content_type $focoelite_cache {
    default                         "no-store";
    "~*text/css"                    "public, max-age=604800";
    "~*application/javascript"      "public, max-age=604800";
    "~*image/svg\+xml"              "public, max-age=604800";
    "~*font/"                       "public, max-age=2592000";
}

# Limite de tentativas de login na borda (a aplicação também tem o seu).
limit_req_zone $binary_remote_addr zone=focoelite_login:10m rate=20r/m;

upstream focoelite_app {
    server 127.0.0.1:4100;
    keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name focoelite.com.br www.focoelite.com.br;

    # Validação do Certbot continua acessível por HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://focoelite.com.br$request_uri;
    }
}

# ---------------------------------------------------------------------
# www → domínio principal (em HTTPS)
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.focoelite.com.br;

    ssl_certificate     /etc/letsencrypt/live/focoelite.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focoelite.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://focoelite.com.br$request_uri;
}

# ---------------------------------------------------------------------
# Aplicação
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name focoelite.com.br;

    ssl_certificate     /etc/letsencrypt/live/focoelite.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focoelite.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS: só depois de confirmar que todo o site funciona em HTTPS.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A aplicação já define Content-Security-Policy, X-Frame-Options e demais
    # cabeçalhos pelo Helmet; não duplique aqui para não haver conflito.

    client_max_body_size 25m;     # PDF de edital ou prova (limite da aplicação: 20 MB)
    server_tokens off;

    access_log /var/log/nginx/focoelite.access.log;
    error_log  /var/log/nginx/focoelite.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- Webhook do Stripe -------------------------------------------------
    # Precisa chegar ao Node com o corpo intacto (a assinatura é validada sobre
    # o corpo bruto) e sem buffering.
    location = /api/billing/webhook {
        proxy_pass http://focoelite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---- Tutor com IA (streaming SSE) --------------------------------------
    location ~ ^/api/tutor/conversations/[^/]+/messages$ {
        proxy_pass http://focoelite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # ---- Correção de redação (pode levar até ~60 s) ------------------------
    location ~ ^/api/essays/[^/]+/submit$ {
        proxy_pass http://focoelite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- Login: limite extra na borda --------------------------------------
    location ~ ^/api/(admin/)?auth/(login|forgot-password|reset-password)$ {
        limit_req zone=focoelite_login burst=10 nodelay;
        proxy_pass http://focoelite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Estáticos ----------------------------------------------------------
    location ~* ^/(css|js|assets|vendor)/ {
        proxy_pass http://focoelite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control $focoelite_cache;
    }

    # ---- Aplicação ----------------------------------------------------------
    location / {
        proxy_pass http://focoelite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
